<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salesforce Interview Cheatsheet</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
:root {
  --bg: #080c14;
  --bg2: #0d1525;
  --node-base: #1e3a5f;
  --accent: #00d4ff;
  --accent2: #ff6b35;
  --accent3: #7c3aed;
  --text: #e2f0ff;
  --text-dim: #5a7a9a;
  --border: rgba(0,212,255,0.15);
  --card: rgba(13,21,37,0.95);
  --glow: rgba(0,212,255,0.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Mono', monospace;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

#app { position: relative; width: 100%; height: 100vh; }

/* HEADER */
#header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(to bottom, rgba(8,12,20,0.95), transparent);
  pointer-events: none;
}
#header h1 {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.1rem;
  letter-spacing: 0.05em;
  color: var(--accent);
  text-transform: uppercase;
}
#header .sub {
  font-size: 0.65rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  margin-top: 2px;
}
#node-count {
  font-size: 0.65rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  pointer-events: all;
}

/* GRAPH */
#graph-container {
  width: 100%;
  height: 100vh;
  position: relative;
}
svg {
  width: 100%;
  height: 100%;
}

.link {
  stroke: rgba(0,212,255,0.12);
  stroke-width: 1;
  transition: stroke 0.3s;
}
.link.active { stroke: rgba(0,212,255,0.5); stroke-width: 1.5; }

.node-group { cursor: pointer; }
.node-group:hover circle { filter: brightness(1.4); }

.node-bg {
  fill: var(--bg2);
  stroke: rgba(0,212,255,0.25);
  stroke-width: 1.5;
  transition: all 0.3s ease;
}
.node-bg.active {
  stroke: var(--accent);
  stroke-width: 2;
  filter: drop-shadow(0 0 12px rgba(0,212,255,0.6));
}
.node-bg.placeholder {
  fill: rgba(13,21,37,0.5);
  stroke: rgba(90,122,154,0.3);
  stroke-dasharray: 4,3;
}

.node-label {
  fill: var(--text);
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 9px;
  text-anchor: middle;
  pointer-events: none;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.node-label.placeholder { fill: var(--text-dim); }

.node-icon {
  fill: var(--accent);
  font-size: 14px;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
}
.node-icon.placeholder { fill: var(--text-dim); }

/* CONTENT PANEL */
#content-panel {
  position: fixed;
  top: 60px;
  right: -440px;
  width: 420px;
  height: calc(100vh - 80px);
  background: var(--card);
  border: 1px solid var(--border);
  border-right: none;
  border-radius: 16px 0 0 16px;
  overflow: hidden;
  transition: right 0.4s cubic-bezier(0.23, 1, 0.32, 1);
  z-index: 50;
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(20px);
}
#content-panel.open { right: 0; }

#panel-header {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-shrink: 0;
}
#panel-title {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.2rem;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  line-height: 1.2;
}
#panel-close {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  cursor: pointer;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  margin-left: 12px;
  margin-top: 2px;
}
#panel-close:hover { border-color: var(--accent); color: var(--accent); }

#panel-body {
  overflow-y: auto;
  flex: 1;
  padding: 0 0 20px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
#panel-body::-webkit-scrollbar { width: 4px; }
#panel-body::-webkit-scrollbar-track { background: transparent; }
#panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* SUBTOPICS */
.subtopic-section {
  border-bottom: 1px solid rgba(0,212,255,0.06);
}
.subtopic-section summary {
  padding: 12px 24px;
  cursor: pointer;
  font-family: 'Syne', sans-serif;
  font-weight: 600;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  color: var(--text);
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
  list-style: none;
  user-select: none;
  transition: color 0.2s;
}
.subtopic-section summary:hover { color: var(--accent); }
.subtopic-section summary::before {
  content: '▶';
  font-size: 8px;
  color: var(--text-dim);
  transition: transform 0.2s;
  flex-shrink: 0;
}
.subtopic-section[open] summary::before { transform: rotate(90deg); color: var(--accent); }
.subtopic-section[open] summary { color: var(--accent); }

.subtopic-content {
  padding: 4px 24px 12px 44px;
}
.subtopic-content li {
  font-size: 0.7rem;
  color: var(--text-dim);
  line-height: 1.8;
  list-style: none;
  position: relative;
  padding-left: 12px;
}
.subtopic-content li::before {
  content: '–';
  position: absolute;
  left: 0;
  color: var(--accent3);
}

/* Question & tip items */
.q-item {
  font-size: 0.68rem;
  color: #a0c4d8;
  padding: 6px 8px;
  background: rgba(0,212,255,0.04);
  border-left: 2px solid rgba(0,212,255,0.3);
  border-radius: 0 4px 4px 0;
  margin: 4px 0;
  line-height: 1.5;
}
.tip-item {
  font-size: 0.68rem;
  color: #c4d8a0;
  padding: 5px 8px;
  background: rgba(124,58,237,0.08);
  border-left: 2px solid rgba(124,58,237,0.4);
  border-radius: 0 4px 4px 0;
  margin: 4px 0;
  line-height: 1.5;
}
.badge {
  display: inline-block;
  font-size: 0.55rem;
  padding: 1px 5px;
  border-radius: 3px;
  margin-right: 4px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  vertical-align: middle;
}
.badge-q { background: rgba(0,212,255,0.15); color: var(--accent); }
.badge-tip { background: rgba(124,58,237,0.2); color: #a78bfa; }

a.topic-link {
  color: var(--accent);
  text-decoration: none;
  font-size: 0.65rem;
  border-bottom: 1px solid rgba(0,212,255,0.3);
  cursor: pointer;
}
a.topic-link:hover { border-bottom-color: var(--accent); }

/* RELATED TOPICS */
.related-row {
  padding: 12px 24px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  border-top: 1px solid var(--border);
  margin-top: 4px;
}
.related-label {
  font-size: 0.6rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  width: 100%;
  margin-bottom: 2px;
}
.related-chip {
  font-size: 0.6rem;
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Space Mono', monospace;
}
.related-chip:hover { border-color: var(--accent); color: var(--accent); }

/* MOBILE */
#mobile-sheet {
  display: none;
  position: fixed;
  bottom: -100%;
  left: 0; right: 0;
  height: 70vh;
  background: var(--card);
  border-top: 1px solid var(--border);
  border-radius: 20px 20px 0 0;
  z-index: 200;
  transition: bottom 0.4s cubic-bezier(0.23, 1, 0.32, 1);
  backdrop-filter: blur(20px);
  overflow: hidden;
  flex-direction: column;
}
#mobile-sheet.open { bottom: 0; display: flex; }
#sheet-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 12px auto 8px;
  flex-shrink: 0;
}
#sheet-header {
  padding: 0 20px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#sheet-title {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1rem;
  color: var(--accent);
  text-transform: uppercase;
}
#sheet-close {
  background: none; border: none;
  color: var(--text-dim); cursor: pointer; font-size: 18px;
}
#sheet-body {
  overflow-y: auto;
  flex: 1;
  padding-bottom: 20px;
}

/* TOOLTIP */
#tooltip {
  position: fixed;
  pointer-events: none;
  z-index: 300;
  background: rgba(13,21,37,0.9);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 0.65rem;
  color: var(--text);
  letter-spacing: 0.05em;
  opacity: 0;
  transition: opacity 0.15s;
  max-width: 180px;
  text-align: center;
}

/* LEGEND */
#legend {
  position: fixed;
  bottom: 20px;
  left: 20px;
  display: flex;
  gap: 14px;
  align-items: center;
  font-size: 0.58rem;
  color: var(--text-dim);
  letter-spacing: 0.06em;
  pointer-events: none;
}
.legend-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 4px;
}

/* INSTRUCTIONS */
#hint {
  position: fixed;
  bottom: 20px;
  right: 20px;
  font-size: 0.58rem;
  color: var(--text-dim);
  letter-spacing: 0.06em;
  text-align: right;
  pointer-events: none;
  line-height: 1.8;
}

@media (max-width: 768px) {
  #content-panel { display: none; }
  #mobile-sheet { display: flex; }
  #hint { display: none; }
  #legend { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div>
      <h1>⚡ Salesforce Cheatsheet</h1>
      <div class="sub">Interview Preparation · Force-Directed Knowledge Map</div>

  <div id="graph-container">
    <svg id="graph"></svg>

  <!-- Desktop side panel -->

      <button id="panel-close">✕</button>
    </div>
    <div id="panel-body"></div>
  </div>

  <!-- Mobile sheet -->
  <div id="mobile-sheet">
    <div id="sheet-handle"></div>
    <div id="sheet-header">
      <div id="sheet-title">Select a Node</div>
      <button id="sheet-close">✕</button>
    </div>
    <div id="sheet-body"></div>
  </div>

  <div id="tooltip"></div>

  <div id="legend">
    <span><span class="legend-dot" style="background:#00d4ff"></span>Core</span>
    <span><span class="legend-dot" style="background:#7c3aed"></span>Dev</span>
    <span><span class="legend-dot" style="background:#ff6b35"></span>Process</span>
    <span><span class="legend-dot" style="background:rgba(90,122,154,0.6)"></span>Coming Soon</span>
  </div>
  <div id="hint">
    scroll · zoom<br>
    click node · explore<br>
    drag · rearrange
  </div>
</div>

// ─── AUTO-LINK DETECTION ──────────────────────────────────────────────────
const TOPIC_ALIASES = {
  "basics": ["basics", "salesforce basics", "multitenant", "sandbox"],
  "datamodel": ["data model", "object", "field", "relationship", "record type", "validation rule", "cmt", "custom metadata"],
  "apex": ["apex", "trigger", "batch", "queueable", "future method", "soql injection"],
  "soql": ["soql", "query", "aggregate", "soql injection", "query plan"],
  "lwc": ["lwc", "lightning web component", "wire", "@api", "@wire", "lms"],
  "security": ["security", "profile", "permission set", "sharing", "owd", "role hierarchy", "flp", "fls"],
  "flow": ["flow", "screen flow", "record-triggered", "before-save", "after-save", "subflow"],
  "integrations": ["integration", "rest", "soap", "named credential", "connected app", "cdc", "bulk api"],
  "javascript": ["javascript", "promise", "async", "closure", "this"],
  "git": ["git", "branch", "merge", "rebase", "commit"],
  "processes": ["scrum", "agile", "kanban", "dod", "dor", "code review"],
};

function buildEdges() {
  const edges = [];
  const added = new Set();
  TOPICS.forEach(t => {
    if (t.category === "placeholder") return;
    const content = JSON.stringify(t.subtopics).toLowerCase();
    TOPICS.forEach(other => {
      if (other.id === t.id || other.category === "placeholder") return;
      const key = [t.id, other.id].sort().join("-");
      if (added.has(key)) return;
      const aliases = TOPIC_ALIASES[other.id] || [];
      const found = aliases.some(a => content.includes(a));
      if (found) { edges.push({ source: t.id, target: other.id }); added.add(key); }
    });
  });
  return edges;
}

// ─── CONTENT BUILDER ──────────────────────────────────────────────────────
function buildContent(topic) {
  if (topic.category === "placeholder") {
    return `<div style="padding:40px 24px;text-align:center;color:var(--text-dim)">
      <div style="font-size:2rem;margin-bottom:12px">🚧</div>
      <div style="font-family:'Syne',sans-serif;font-size:0.8rem;letter-spacing:0.1em;text-transform:uppercase">Coming Soon</div>
      <div style="font-size:0.65rem;margin-top:8px;line-height:1.6">This topic will be added<br>in the next update.</div>
    </div>`;
  }
  let html = "";
  topic.subtopics.forEach((sub, i) => {
    html += `<details class="subtopic-section"${i === 0 ? " open" : ""}>
      <summary>${sub.name}</summary>
      <div class="subtopic-content"><ul>`;
    sub.items.forEach(item => {
      html += `<li>${item}</li>`;
    });
    html += "</ul>";
    if (sub.tips) sub.tips.forEach(t => {
      html += `<div class="tip-item"><span class="badge badge-tip">💡 TIP</span>${t}</div>`;
    });
    if (sub.questions) sub.questions.forEach(q => {
      html += `<div class="q-item"><span class="badge badge-q">❓ Q</span>${q}</div>`;
    });
    html += "</div></details>";
  });

  // Related topics
  const related = buildEdges().filter(e => e.source === topic.id || e.target === topic.id)
    .map(e => e.source === topic.id ? e.target : e.source);
  if (related.length) {
    html += `<div class="related-row"><div class="related-label">Related Topics</div>`;
    related.forEach(rid => {
      const rt = TOPICS.find(t => t.id === rid);
      if (rt) html += `<span class="related-chip" onclick="selectTopic('${rid}')">${rt.label}</span>`;
    });
    html += "</div>";
  }
  return html;
}

// ─── D3 GRAPH ─────────────────────────────────────────────────────────────
const edges = buildEdges();
const nodes = TOPICS.map(t => ({ ...t }));

const isMobile = () => window.innerWidth <= 768;

let selectedId = null;

const svg = d3.select("#graph");
const g = svg.append("g");

// zoom
const zoom = d3.zoom()
  .scaleExtent([0.3, 3])
  .on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom).on("dblclick.zoom", null);

// defs: glow filter
const defs = svg.append("defs");
const filter = defs.append("filter").attr("id", "glow");
filter.append("feGaussianBlur").attr("stdDeviation", "4").attr("result", "coloredBlur");
const merge = filter.append("feMerge");
merge.append("feMergeNode").attr("in", "coloredBlur");
merge.append("feMergeNode").attr("in", "SourceGraphic");

const W = () => window.innerWidth;
const H = () => window.innerHeight;

const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(edges).id(d => d.id).distance(d => {
    if (d.source.category === "placeholder" || d.target.category === "placeholder") return 120;
    return 130;
  }).strength(0.4))
  .force("charge", d3.forceManyBody().strength(-350))
  .force("center", d3.forceCenter(W() / 2, H() / 2))
  .force("collision", d3.forceCollide(d => d.size + 22))
  .alpha(1).alphaDecay(0.02);

// links
const link = g.append("g").selectAll("line")
  .data(edges).join("line").attr("class", "link");

// nodes
const nodeGroup = g.append("g").selectAll(".node-group")
  .data(nodes).join("g")
  .attr("class", "node-group")
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
  );

nodeGroup.append("circle")
  .attr("class", d => d.category === "placeholder" ? "node-bg placeholder" : "node-bg")
  .attr("r", d => d.size);

// gradient fill for non-placeholder
nodeGroup.each(function(d) {
  if (d.category === "placeholder") return;
  const gradId = `grad-${d.id}`;
  const grad = defs.append("radialGradient").attr("id", gradId)
    .attr("cx", "35%").attr("cy", "35%").attr("r", "65%");
  grad.append("stop").attr("offset", "0%").attr("stop-color", d.color).attr("stop-opacity", 0.25);
  grad.append("stop").attr("offset", "100%").attr("stop-color", d.color).attr("stop-opacity", 0.05);
  d3.select(this).select("circle").style("fill", `url(#${gradId})`);
});

nodeGroup.append("text")
  .attr("class", d => d.category === "placeholder" ? "node-icon placeholder" : "node-icon")
  .attr("y", d => d.subtopics.length ? -6 : 0)
  .style("font-size", d => Math.max(10, d.size * 0.55) + "px")
  .text(d => d.icon);

nodeGroup.append("text")
  .attr("class", d => d.category === "placeholder" ? "node-label placeholder" : "node-label")
  .attr("y", d => d.subtopics.length ? d.size * 0.45 : d.size * 0.45)
  .style("font-size", d => Math.min(9, d.size * 0.26) + "px")
  .text(d => d.label);

// click
nodeGroup.on("click", (e, d) => {
  e.stopPropagation();
  selectTopic(d.id);
}).on("mouseenter", (e, d) => {
  const tip = document.getElementById("tooltip");
  tip.textContent = d.label + (d.category === "placeholder" ? " (coming soon)" : ` · ${d.subtopics.length} sections`);
  tip.style.opacity = "1";
}).on("mousemove", e => {
  const tip = document.getElementById("tooltip");
  tip.style.left = (e.clientX + 12) + "px";
  tip.style.top = (e.clientY - 10) + "px";
}).on("mouseleave", () => {
  document.getElementById("tooltip").style.opacity = "0";
});

svg.on("click", () => closeTopic());

simulation.on("tick", () => {
  link
    .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  nodeGroup.attr("transform", d => `translate(${d.x},${d.y})`);
});

// ─── TOPIC SELECTION ──────────────────────────────────────────────────────
function selectTopic(id) {
  selectedId = id;
  const topic = TOPICS.find(t => t.id === id);
  if (!topic) return;

  const content = buildContent(topic);

  // highlight node
  nodeGroup.selectAll("circle").classed("active", d => d.id === id);
  link.classed("active", d => d.source.id === id || d.target.id === id);

  if (isMobile()) {
    document.getElementById("sheet-title").textContent = topic.label;
    document.getElementById("sheet-body").innerHTML = content;
    document.getElementById("mobile-sheet").classList.add("open");
  } else {
    document.getElementById("panel-title").textContent = topic.label;
    document.getElementById("panel-body").innerHTML = content;
    document.getElementById("content-panel").classList.add("open");
  }

  // pan toward node
  const node = nodes.find(n => n.id === id);
  if (node) {
    const offset = isMobile() ? 0 : -200;
    const tx = W() / 2 - node.x + offset;
    const ty = H() / 2 - node.y;
    svg.transition().duration(500).call(zoom.transform,
      d3.zoomIdentity.translate(tx, ty).scale(1));
  }
}

function closeTopic() {
  selectedId = null;
  nodeGroup.selectAll("circle").classed("active", false);
  link.classed("active", false);
  document.getElementById("content-panel").classList.remove("open");
  document.getElementById("mobile-sheet").classList.remove("open");
}

document.getElementById("panel-close").addEventListener("click", e => { e.stopPropagation(); closeTopic(); });
document.getElementById("sheet-close").addEventListener("click", e => { e.stopPropagation(); closeTopic(); });

// node count
document.getElementById("node-count").textContent =
  `${TOPICS.filter(t => t.category !== "placeholder").length} topics · ${TOPICS.filter(t => t.category === "placeholder").length} coming soon`;

// initial zoom to fit
setTimeout(() => {
  const pad = 60;
  svg.call(zoom.transform, d3.zoomIdentity.translate(W() * 0.05, H() * 0.05).scale(0.85));
}, 800);

// resize
window.addEventListener("resize", () => {
  simulation.force("center", d3.forceCenter(W() / 2, H() / 2));
  simulation.alpha(0.3).restart();
});
</script>
