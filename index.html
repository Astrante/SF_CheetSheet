<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salesforce Interview Cheatsheet</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
[data-theme="light"] {
  --bg: #f5f4f0;
  --surface: #ffffff;
  --border: #d8d5ce;
  --border-strong: #a09b91;
  --text: #1a1816;
  --text-2: #6b6560;
  --text-3: #9c978f;
  --accent-soft: rgba(26,24,22,0.06);
  --node-fill: #ffffff;
  --node-stroke: #c8c3bb;
  --node-stroke-active: #1a1816;
  --link-color: rgba(26,24,22,0.1);
  --link-active: rgba(26,24,22,0.4);
  --placeholder-fill: #eeede9;
  --placeholder-stroke: #cbc7bf;
  --placeholder-text: #b0aba3;
  --cat-core: #1a1816;
  --cat-dev: #3d6b9e;
  --cat-process: #4e7c5f;
  --panel-bg: rgba(255,255,255,0.97);
  --tip-bg: #f5f4f0;
  --tip-border: #cbc7bf;
  --q-bg: #eff4f9;
  --q-border: #b0c4d8;
  --badge-q-bg: #dce9f4;
  --badge-q-text: #2d5f8a;
  --badge-tip-bg: #e8e6e0;
  --badge-tip-text: #5a5550;
  --chip-bg: #f0eeea;
  --chip-border: #cbc7bf;
  --toggle-bg: #e8e6e0;
  --toggle-text: #6b6560;
}
[data-theme="dark"] {
  --bg: #111110;
  --surface: #1c1b1a;
  --border: #2e2c29;
  --border-strong: #4a4742;
  --text: #e8e6e2;
  --text-2: #8a8680;
  --text-3: #5a5650;
  --accent-soft: rgba(232,230,226,0.06);
  --node-fill: #1c1b1a;
  --node-stroke: #38362f;
  --node-stroke-active: #e8e6e2;
  --link-color: rgba(232,230,226,0.07);
  --link-active: rgba(232,230,226,0.32);
  --placeholder-fill: #161614;
  --placeholder-stroke: #252320;
  --placeholder-text: #3e3c38;
  --cat-core: #e8e6e2;
  --cat-dev: #7badd0;
  --cat-process: #82b896;
  --panel-bg: rgba(28,27,26,0.97);
  --tip-bg: #222120;
  --tip-border: #38362f;
  --q-bg: #1a2028;
  --q-border: #2a3848;
  --badge-q-bg: #1a3050;
  --badge-q-text: #7ab0d8;
  --badge-tip-bg: #28262a;
  --badge-tip-text: #8a8680;
  --chip-bg: #222120;
  --chip-border: #38362f;
  --toggle-bg: #28262a;
  --toggle-text: #8a8680;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  transition: background 0.2s, color 0.2s;
}
#app { position: relative; width: 100%; height: 100vh; }

/* HEADER */
#header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: 16px 24px;
  display: flex; align-items: center; justify-content: space-between;
  pointer-events: none;
}
#header-left { pointer-events: none; }
#header h1 { font-weight: 600; font-size: 0.82rem; color: var(--text); letter-spacing: -0.01em; }
#header .sub { font-size: 0.67rem; color: var(--text-3); margin-top: 2px; font-family: 'IBM Plex Mono', monospace; }
#header-right { display: flex; align-items: center; gap: 12px; pointer-events: all; }
#node-count { font-size: 0.65rem; color: var(--text-3); font-family: 'IBM Plex Mono', monospace; }
#theme-toggle {
  width: 30px; height: 30px; border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--toggle-bg); color: var(--toggle-text);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-family: 'IBM Plex Mono', monospace;
  transition: border-color 0.15s; flex-shrink: 0;
}
#theme-toggle:hover { border-color: var(--border-strong); }

/* GRAPH */
svg { width: 100%; height: 100%; }
.link { stroke: var(--link-color); stroke-width: 1; transition: stroke 0.25s; }
.link.active { stroke: var(--link-active); stroke-width: 1.5; }
.node-group { cursor: pointer; }
.node-bg { fill: var(--node-fill); stroke: var(--node-stroke); stroke-width: 1.5; transition: stroke 0.2s, stroke-width 0.2s; }
.node-bg.active { stroke: var(--node-stroke-active); stroke-width: 1.5; }
.node-bg.placeholder { fill: var(--placeholder-fill); stroke: var(--placeholder-stroke); stroke-dasharray: 3 3; }

/* PANEL */
#content-panel {
  position: fixed; top: 56px; right: -410px;
  width: 390px; height: calc(100vh - 72px);
  background: var(--panel-bg);
  border: 1px solid var(--border); border-right: none;
  border-radius: 10px 0 0 10px;
  overflow: hidden;
  transition: right 0.32s cubic-bezier(0.23,1,0.32,1), background 0.2s;
  z-index: 50; display: flex; flex-direction: column;
  backdrop-filter: blur(14px);
}
#content-panel.open { right: 0; }
#panel-header {
  padding: 16px 20px 12px; border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between; flex-shrink: 0;
}
#panel-title { font-weight: 600; font-size: 0.88rem; color: var(--text); letter-spacing: -0.01em; }
#panel-close {
  background: none; border: 1px solid var(--border); color: var(--text-3);
  cursor: pointer; width: 24px; height: 24px; border-radius: 5px; font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.15s, color 0.15s; margin-left: 12px; flex-shrink: 0;
}
#panel-close:hover { border-color: var(--border-strong); color: var(--text); }
#panel-body { overflow-y: auto; flex: 1; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
#panel-body::-webkit-scrollbar { width: 3px; }
#panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* SUBTOPICS */
.subtopic-section { border-bottom: 1px solid var(--border); }
.subtopic-section summary {
  padding: 10px 20px; cursor: pointer; font-weight: 500; font-size: 0.73rem;
  color: var(--text-2); display: flex; align-items: center; gap: 8px;
  list-style: none; user-select: none; transition: color 0.15s;
}
.subtopic-section summary:hover { color: var(--text); }
.subtopic-section summary::before { content: '+'; font-size: 13px; color: var(--text-3); width: 14px; flex-shrink: 0; font-weight: 400; }
.subtopic-section[open] summary::before { content: '−'; color: var(--text-2); }
.subtopic-section[open] summary { color: var(--text); }
.subtopic-content { padding: 2px 20px 10px 42px; }
.subtopic-content ul { list-style: none; }
.subtopic-content li {
  font-size: 0.71rem; color: var(--text-2); line-height: 1.9; position: relative; padding-left: 12px;
}
.subtopic-content li::before { content: '·'; position: absolute; left: 0; color: var(--text-3); }
.q-item {
  font-size: 0.68rem; color: var(--text-2); padding: 4px 8px;
  background: var(--q-bg); border-left: 2px solid var(--q-border);
  margin: 3px 0; line-height: 1.5;
}
.tip-item {
  font-size: 0.68rem; color: var(--text-2); padding: 4px 8px;
  background: var(--tip-bg); border-left: 2px solid var(--tip-border);
  margin: 3px 0; line-height: 1.5;
}
.badge {
  display: inline-block; font-size: 0.54rem; padding: 1px 5px; border-radius: 3px;
  margin-right: 5px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase;
  font-family: 'IBM Plex Mono', monospace; vertical-align: middle;
}
.badge-q { background: var(--badge-q-bg); color: var(--badge-q-text); }
.badge-tip { background: var(--badge-tip-bg); color: var(--badge-tip-text); }
.related-row { padding: 12px 20px; border-top: 1px solid var(--border); margin-top: 4px; }
.related-label {
  font-size: 0.6rem; color: var(--text-3); letter-spacing: 0.07em; text-transform: uppercase;
  font-family: 'IBM Plex Mono', monospace; margin-bottom: 8px;
}
.related-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.related-chip {
  font-size: 0.63rem; padding: 3px 9px; border: 1px solid var(--chip-border);
  border-radius: 20px; color: var(--text-2); cursor: pointer; transition: all 0.15s;
  background: var(--chip-bg); font-family: 'IBM Plex Mono', monospace;
}
.related-chip:hover { border-color: var(--border-strong); color: var(--text); background: var(--accent-soft); }

/* MOBILE SHEET */
#mobile-sheet {
  display: none; position: fixed; bottom: -100%; left: 0; right: 0;
  height: 70vh; background: var(--panel-bg);
  border-top: 1px solid var(--border); border-radius: 14px 14px 0 0;
  z-index: 200; transition: bottom 0.32s cubic-bezier(0.23,1,0.32,1);
  backdrop-filter: blur(14px); overflow: hidden; flex-direction: column;
}
#mobile-sheet.open { bottom: 0; display: flex; }
#sheet-handle { width: 32px; height: 3px; background: var(--border); border-radius: 2px; margin: 10px auto 6px; flex-shrink: 0; }
#sheet-header { padding: 0 20px 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); flex-shrink: 0; }
#sheet-title { font-weight: 600; font-size: 0.88rem; color: var(--text); }
#sheet-close { background: none; border: none; color: var(--text-3); cursor: pointer; font-size: 18px; }
#sheet-body { overflow-y: auto; flex: 1; padding-bottom: 20px; }

/* TOOLTIP */
#tooltip {
  position: fixed; pointer-events: none; z-index: 300;
  background: var(--surface); border: 1px solid var(--border); border-radius: 5px;
  padding: 5px 9px; font-size: 0.63rem; color: var(--text-2);
  opacity: 0; transition: opacity 0.1s; font-family: 'IBM Plex Mono', monospace; white-space: nowrap;
}

/* FOOTER */
#hint {
  position: fixed; bottom: 16px; right: 20px;
  font-size: 0.58rem; color: var(--text-3); text-align: right;
  pointer-events: none; line-height: 2; font-family: 'IBM Plex Mono', monospace;
}
#legend {
  position: fixed; bottom: 16px; left: 20px;
  display: flex; gap: 14px; font-size: 0.58rem; color: var(--text-3);
  font-family: 'IBM Plex Mono', monospace; pointer-events: none; align-items: center;
}
.ldot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 4px; vertical-align: middle; }

@media (max-width: 768px) {
  #content-panel { display: none; }
  #mobile-sheet { display: flex; }
  #hint, #legend { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="header-left">
      <h1>Salesforce Interview Cheatsheet</h1>
      <div class="sub">knowledge graph · click any node to explore</div>
    </div>
    <div id="header-right">
      <span id="node-count"></span>
      <button id="theme-toggle" title="Toggle light / dark" onclick="toggleTheme()">◐</button>
    </div>
  </div>

  <div id="graph-container"><svg id="graph"></svg></div>

  <div id="content-panel">
    <div id="panel-header">
      <div id="panel-title">Select a node</div>
      <button id="panel-close">✕</button>
    </div>
    <div id="panel-body"></div>
  </div>

  <div id="mobile-sheet">
    <div id="sheet-handle"></div>
    <div id="sheet-header">
      <div id="sheet-title">Select a node</div>
      <button id="sheet-close">✕</button>
    </div>
    <div id="sheet-body"></div>
  </div>

  <div id="tooltip"></div>
  <div id="legend">
    <span><span class="ldot" id="dot-core"></span>core</span>
    <span><span class="ldot" id="dot-dev"></span>dev</span>
    <span><span class="ldot" id="dot-process"></span>process</span>
  </div>
  <div id="hint">scroll to zoom · drag to rearrange<br>click node to open · esc to close</div>
</div>

function toggleTheme() {
  const html = document.documentElement;
  const next = html.dataset.theme === "light" ? "dark" : "light";
  html.dataset.theme = next;
  localStorage.setItem("sf-cheatsheet-theme", next);
  updateNodeColors();
}
(function() {
  const saved = localStorage.getItem("sf-cheatsheet-theme") ||
    (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = saved;
})();
function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

  { id:"aura", label:"Aura", abbr:"AUR", size:22, category:"placeholder", subtopics:[] },
  { id:"visualforce", label:"Visualforce", abbr:"VF", size:22, category:"placeholder", subtopics:[] },
  { id:"ai", label:"AI", abbr:"AI", size:22, category:"placeholder", subtopics:[] },
];

const ALIASES = {
  basics:["salesforce basics","multitenant","sandbox"],
  datamodel:["data model","object","field","relationship","record type","validation rule","cmt","custom metadata"],
  apex:["apex","trigger","batch","queueable","future method"],
  soql:["soql","query","aggregate","query plan"],
  lwc:["lwc","lightning web component","wire","@api","@wire","lms"],
  security:["security","profile","permission set","sharing","owd","role hierarchy","fls"],
  flow:["flow","screen flow","record-triggered","before-save","after-save","subflow"],
  integrations:["integration","rest","soap","named credential","connected app","cdc","bulk api"],
  javascript:["javascript","promise","async","closure","this"],
  git:["git","branch","merge","rebase","commit"],
  processes:["scrum","agile","kanban","dod","dor","code review"],
};

function buildEdges() {
  const edges=[], added=new Set();
  TOPICS.forEach(t => {
    if(t.category==="placeholder") return;
    const content=JSON.stringify(t.subtopics).toLowerCase();
    TOPICS.forEach(other => {
      if(other.id===t.id||other.category==="placeholder") return;
      const key=[t.id,other.id].sort().join("-");
      if(added.has(key)) return;
      if((ALIASES[other.id]||[]).some(a=>content.includes(a))) { edges.push({source:t.id,target:other.id}); added.add(key); }
    });
  });
  return edges;
}

function buildContent(topic) {
  if(topic.category==="placeholder") {
    return `<div style="padding:48px 20px;text-align:center">
      <div style="font-size:0.73rem;font-weight:500;color:var(--text-2);margin-bottom:6px">${topic.label}</div>
      <div style="font-size:0.67rem;color:var(--text-3);font-family:'IBM Plex Mono',monospace">coming soon</div>
    </div>`;
  }
  let html="";
  topic.subtopics.forEach((sub,i) => {
    html+=`<details class="subtopic-section"${i===0?" open":""}><summary>${sub.name}</summary><div class="subtopic-content"><ul>`;
    sub.items.forEach(item => { html+=`<li>${item}</li>`; });
    html+="</ul>";
    if(sub.tips) sub.tips.forEach(t => { html+=`<div class="tip-item"><span class="badge badge-tip">tip</span>${t}</div>`; });
    if(sub.questions) sub.questions.forEach(q => { html+=`<div class="q-item"><span class="badge badge-q">q</span>${q}</div>`; });
    html+="</div></details>";
  });
  const related=buildEdges().filter(e=>e.source===topic.id||e.target===topic.id).map(e=>e.source===topic.id?e.target:e.source);
  if(related.length) {
    html+=`<div class="related-row"><div class="related-label">Related</div><div class="related-chips">`;
    related.forEach(rid => { const rt=TOPICS.find(t=>t.id===rid); if(rt) html+=`<span class="related-chip" onclick="selectTopic('${rid}')">${rt.label}</span>`; });
    html+="</div></div>";
  }
  return html;
}

// ── D3 GRAPH ──────────────────────────────────────────────────────────────
const edges=buildEdges();
const nodes=TOPICS.map(t=>({...t}));
const isMobile=()=>window.innerWidth<=768;
const W=()=>window.innerWidth;
const H=()=>window.innerHeight;
let selectedId=null;

const svg=d3.select("#graph");
const g=svg.append("g");
const zoom=d3.zoom().scaleExtent([0.2,3]).on("zoom",e=>g.attr("transform",e.transform));
svg.call(zoom).on("dblclick.zoom",null);

const simulation=d3.forceSimulation(nodes)
  .force("link",d3.forceLink(edges).id(d=>d.id).distance(d=>(d.source.category==="placeholder"||d.target.category==="placeholder")?100:145).strength(0.4))
  .force("charge",d3.forceManyBody().strength(-310))
  .force("center",d3.forceCenter(W()/2,H()/2))
  .force("collision",d3.forceCollide(d=>d.size+18))
  .alpha(1).alphaDecay(0.02);

const link=g.append("g").selectAll("line").data(edges).join("line").attr("class","link");

const nodeGroup=g.append("g").selectAll(".node-group").data(nodes).join("g").attr("class","node-group")
  .call(d3.drag()
    .on("start",(e,d)=>{ if(!e.active) simulation.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag",(e,d)=>{ d.fx=e.x; d.fy=e.y; })
    .on("end",(e,d)=>{ if(!e.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; })
  );

nodeGroup.append("circle")
  .attr("class",d=>"node-bg"+(d.category==="placeholder"?" placeholder":""))
  .attr("r",d=>d.size);

const abbrTexts = nodeGroup.append("text")
  .attr("text-anchor","middle").attr("dominant-baseline","middle")
  .attr("font-family","'IBM Plex Mono', monospace").attr("font-weight","500")
  .attr("pointer-events","none")
  .attr("y",d=>d.subtopics&&d.subtopics.length?-5:0)
  .attr("font-size",d=>Math.max(10,d.size*0.35)+"px")
  .text(d=>d.abbr);

const labelTexts = nodeGroup.append("text")
  .attr("text-anchor","middle").attr("dominant-baseline","auto")
  .attr("font-family","'IBM Plex Sans', sans-serif").attr("font-size","9px").attr("font-weight","500")
  .attr("pointer-events","none")
  .attr("y",d=>d.size*0.5)
  .text(d=>d.label);

function updateNodeColors() {
  abbrTexts.attr("fill",d=>{
    if(d.category==="placeholder") return cssVar("--placeholder-text");
    return cssVar("--cat-"+d.category);
  });
  labelTexts.attr("fill",d=>{
    if(d.category==="placeholder") return cssVar("--placeholder-text");
    return cssVar("--text-2");
  });
  // update legend dots
  ["core","dev","process"].forEach(c => {
    const el=document.getElementById("dot-"+c);
    if(el) el.style.background=cssVar("--cat-"+c);
  });
}

// Force initial color update
setTimeout(() => updateNodeColors(), 100);
// Also update on window load
window.addEventListener('load', () => updateNodeColors());

nodeGroup.on("click",(e,d)=>{ e.stopPropagation(); selectTopic(d.id); })
  .on("mouseenter",(e,d)=>{
    const tip=document.getElementById("tooltip");
    tip.textContent=d.label+(d.category==="placeholder"?" · coming soon":` · ${d.subtopics.length} sections`);
    tip.style.opacity="1";
  })
  .on("mousemove",e=>{ const tip=document.getElementById("tooltip"); tip.style.left=(e.clientX+12)+"px"; tip.style.top=(e.clientY-10)+"px"; })
  .on("mouseleave",()=>{ document.getElementById("tooltip").style.opacity="0"; });

svg.on("click",()=>closeTopic());

simulation.on("tick",()=>{
  link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  nodeGroup.attr("transform",d=>`translate(${d.x},${d.y})`);
});

// ── SELECTION ─────────────────────────────────────────────────────────────
function selectTopic(id) {
  selectedId=id;
  const topic=TOPICS.find(t=>t.id===id);
  if(!topic) return;
  const content=buildContent(topic);
  nodeGroup.selectAll("circle.node-bg").classed("active",d=>d.id===id);
  link.classed("active",d=>d.source.id===id||d.target.id===id);
  if(isMobile()) {
    document.getElementById("sheet-title").textContent=topic.label;
    document.getElementById("sheet-body").innerHTML=content;
    document.getElementById("mobile-sheet").classList.add("open");
  } else {
    document.getElementById("panel-title").textContent=topic.label;
    document.getElementById("panel-body").innerHTML=content;
    document.getElementById("content-panel").classList.add("open");
  }
  const node=nodes.find(n=>n.id===id);
  if(node) {
    const offset=isMobile()?0:-175;
    svg.transition().duration(420).call(zoom.transform,d3.zoomIdentity.translate(W()/2-node.x+offset,H()/2-node.y).scale(1));
  }
}
function closeTopic() {
  selectedId=null;
  nodeGroup.selectAll("circle.node-bg").classed("active",false);
  link.classed("active",false);
  document.getElementById("content-panel").classList.remove("open");
  document.getElementById("mobile-sheet").classList.remove("open");
}

document.getElementById("panel-close").addEventListener("click",e=>{ e.stopPropagation(); closeTopic(); });
document.getElementById("sheet-close").addEventListener("click",e=>{ e.stopPropagation(); closeTopic(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeTopic(); });
document.getElementById("node-count").textContent=TOPICS.filter(t=>t.category!=="placeholder").length+" topics";
window.addEventListener("resize",()=>{ simulation.force("center",d3.forceCenter(W()/2,H()/2)).alpha(0.3).restart(); });
setTimeout(()=>{ svg.call(zoom.transform,d3.zoomIdentity.translate(W()*0.04,H()*0.06).scale(0.88)); },700);
</script>
</body>
</html>
