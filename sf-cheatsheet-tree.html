<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salesforce Interview Cheatsheet - Tree View</title>
    <meta name="theme-color" content="#1f1f1e">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--text);
            color: var(--bg);
            padding: 8px 16px;
            text-decoration: none;
            z-index: 1000;
            border-radius: 0 0 4px 0
        }

        .skip-link:focus {
            top: 0
        }

        :focus-visible {
            outline: 2px solid var(--text);
            outline-offset: 2px
        }

        @media(prefers-reduced-motion:reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important
            }
        }

        [data-theme="light"] {
            --bg: #fafafa;
            --surface: #fff;
            --border: #e5e5e5;
            --border-strong: #d4d4d4;
            --text: #171717;
            --text-2: #737373;
            --text-3: #a3a3a3;
            --accent-soft: rgba(0, 0, 0, .04);
            --code-bg: #fafafa;
            --code-border: #e5e5e5;
            --toggle-bg: #f5f5f5;
            --toggle-text: #737373;
            --color-basics: #8B5CF6;
            --color-datamodel: #3B82F6;
            --color-soql: #0EA5E9;
            --color-apex: #F97316;
            --color-lwc: #EF4444;
            --color-security: #22C55E;
            --color-flow: #A855F7;
            --color-integrations: #EAB308;
            --color-javascript: #EC4899;
            --color-git: #14B8A6;
            --color-processes: #6B7280;
            --color-limits: #1E40AF;
            --color-sosl: #06B6D4;
            --color-setup: #64748B;
            --color-aura: #8B5CF6;
            --color-visualforce: #6366F1;
            --color-ai: #10B981
        }

        [data-theme="dark"] {
            --bg: #1f1f1e;
            --surface: #2a2a29;
            --border: #3a3a38;
            --border-strong: #525250;
            --text: #fafafa;
            --text-2: #a3a3a3;
            --text-3: #737373;
            --accent-soft: rgba(255, 255, 255, .04);
            --code-bg: #2a2a29;
            --code-border: #3a3a38;
            --toggle-bg: #2a2a29;
            --toggle-text: #a3a3a3;
            --color-basics: #A78BFA;
            --color-datamodel: #60A5FA;
            --color-soql: #38BDF8;
            --color-apex: #FB923C;
            --color-lwc: #F87171;
            --color-security: #4ADE80;
            --color-flow: #C084FC;
            --color-integrations: #FACC15;
            --color-javascript: #F472B6;
            --color-git: #2DD4BF;
            --color-processes: #9CA3AF;
            --color-limits: #3B82F6;
            --color-sosl: #22D3EE;
            --color-setup: #94A3B8;
            --color-aura: #A78BFA;
            --color-visualforce: #818CF8;
            --color-ai: #34D399
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: clip;
            min-height: 100vh;
            transition: background .2s, color .2s
        }

        #app {
            position: relative;
            width: 100%;
            min-height: 100vh
        }

        #header {
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: clamp(.75rem, 1.5vw, 1rem) clamp(1rem, 2vw, 1.5rem);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(to bottom, var(--bg), transparent);
            pointer-events: none
        }

        #nav-toggle {
            width: clamp(2rem, 3vw, 2.125rem);
            height: clamp(2rem, 3vw, 2.125rem);
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--toggle-bg);
            color: var(--toggle-text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            flex-shrink: 0;
            margin-right: clamp(.5rem, 1vw, .875rem);
        }

        #nav-toggle:hover {
            border-color: var(--border-strong);
            background: var(--accent-soft)
        }

        #nav-panel {
            position: fixed;
            top: 0;
            left: -100%;
            width: clamp(280px, 25vw, 400px);
            height: 100vh;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            z-index: 200;
            transition: left 0.3s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 6px 0 24px rgba(0, 0, 0, 0.15);
        }

        #nav-panel.open {
            left: 0;
        }

        #nav-header {
            padding: clamp(.75rem, 1.5vw, 1rem) clamp(1rem, 2vw, 1.5rem);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: var(--surface);
        }

        #nav-title {
            font-weight: 600;
            font-size: clamp(.75rem, 1.2vw, .875rem);
            color: var(--text);
        }

        #nav-close {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-3);
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        #nav-close:hover {
            border-color: var(--border-strong);
            color: var(--text);
        }

        #nav-body {
            flex: 1;
            overflow-y: auto;
            padding: clamp(.5rem, 1vw, .75rem);
        }

        #nav-tree {
            user-select: none;
        }

        .nav-node {
            margin-bottom: 2px;
        }

        .nav-node-header {
            display: flex;
            align-items: center;
            gap: clamp(.375rem, .75vw, .5rem);
            padding: clamp(.5rem, 1vw, .625rem);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .nav-node-header:hover {
            background: var(--accent-soft);
        }

        .nav-node-header.active {
            background: var(--accent-soft);
        }

        .nav-node-header.active .nav-node-label {
            font-weight: 600;
        }

        .nav-node-toggle {
            width: clamp(1rem, 1.5vw, 1.25rem);
            height: clamp(1rem, 1.5vw, 1.25rem);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            flex-shrink: 0;
            font-size: clamp(.7rem, 1vw, .75rem);
            color: var(--text-3);
        }

        .nav-node-toggle.expanded {
            transform: rotate(90deg);
        }

        .nav-node-toggle.leaf {
            visibility: hidden;
        }

        .nav-node-dot {
            width: clamp(.5rem, .75vw, .625rem);
            height: clamp(.5rem, .75vw, .625rem);
            border-radius: 50%;
            flex-shrink: 0;
        }

        .nav-node-label {
            flex: 1;
            font-size: clamp(.7rem, 1vw, .8rem);
            color: var(--text);
            font-weight: 500;
        }

        .nav-node-children {
            margin-left: clamp(1rem, 1.5vw, 1.25rem);
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .nav-node-children.expanded {
            max-height: 2000px;
            transition: max-height 0.5s ease-in;
        }

        #breadcrumbs {
            position: sticky;
            top: 60px;
            left: 0;
            right: 0;
            z-index: 50;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: clamp(.5rem, 1vw, .75rem) clamp(1rem, 2vw, 1.5rem);
            display: flex;
            align-items: center;
            gap: clamp(.5rem, 1vw, .75rem);
        }

        .breadcrumb {
            font-size: clamp(.6rem, .9vw, .7rem);
            color: var(--text-3);
            text-decoration: none;
            transition: color 0.2s;
            font-family: 'IBM Plex Mono', monospace;
        }

        .breadcrumb:hover {
            color: var(--text);
        }

        .breadcrumb.current {
            color: var(--text);
            font-weight: 600;
        }

        .breadcrumb-separator {
            color: var(--text-3);
            font-size: clamp(.6rem, .9vw, .7rem);
        }

        #main-container {
            display: flex;
            min-height: calc(100vh - 60px);
            transition: margin-left 0.3s ease;
        }

        #main-container.nav-open {
            margin-left: clamp(280px, 25vw, 400px);
        }

        #header-left {
            pointer-events: none
        }

        #header h1 {
            font-weight: 700;
            font-size: clamp(.875rem, 1.2vw, 1rem);
            color: var(--text);
            letter-spacing: -.02em
        }

        #header .sub {
            font-size: clamp(.6rem, .8vw, .64rem);
            color: var(--text-3);
            margin-top: 3px;
            font-family: 'IBM Plex Mono', monospace;
            letter-spacing: .05em;
            text-transform: uppercase
        }

        #header-right {
            display: flex;
            align-items: center;
            gap: clamp(.5rem, 1vw, .875rem);
            pointer-events: all
        }

        #theme-toggle {
            width: clamp(2rem, 3vw, 2.125rem);
            height: clamp(2rem, 3vw, 2.125rem);
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--toggle-bg);
            color: var(--toggle-text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-family: 'IBM Plex Mono', monospace;
            transition: all .2s;
            flex-shrink: 0
        }

        #theme-toggle:hover {
            border-color: var(--border-strong);
            background: var(--accent-soft)
        }

        #main-container {
            display: flex;
            min-height: calc(100vh - 60px)
        }

        /* Navigation Panel Styles - Updated for new nav-panel */
#nav-panel {
            width: clamp(280px, 25vw, 400px);
            min-width: 280px;
            max-width: 400px;
            border-right: 1px solid var(--border);
            background: var(--surface);
            overflow-y: auto;
            flex-shrink: 0;
            position: fixed;
            top: 0;
            left: -100%;
            height: 100vh;
            z-index: 200;
            transition: left 0.3s ease;
            box-shadow: 6px 0 24px rgba(0, 0, 0, 0.15);
        }

        #nav-panel.open {
            left: 0;
        }

        /* Override some existing styles for proper layout */
        #main-container {
            display: flex;
            min-height: calc(100vh - 60px);
            transition: margin-left 0.3s ease;
        }

        #main-container.nav-open {
            margin-left: clamp(280px, 25vw, 400px);
        }

        #tree-panel::-webkit-scrollbar {
            width: 4px
        }

        #tree-panel::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px
        }

        #tree-header {
            padding: clamp(.75rem, 1.5vw, 1rem) clamp(1rem, 2vw, 1.5rem);
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: clamp(.75rem, 1vw, .875rem);
            color: var(--text)
        }

        #tree-search {
            padding: clamp(.5rem, 1vw, .75rem);
            border-bottom: 1px solid var(--border)
        }

        #tree-search input {
            width: 100%;
            padding: clamp(.5rem, 1vw, .75rem);
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            font-size: clamp(.7rem, 1vw, .8rem);
            font-family: 'IBM Plex Sans', sans-serif
        }

        #tree-search input:focus {
            outline: none;
            border-color: var(--text)
        }

        #tree {
            padding: clamp(.5rem, 1vw, .75rem)
        }

        .tree-node {
            margin-bottom: clamp(.25rem, .5vw, .5rem)
        }

        .tree-node-header {
            display: flex;
            align-items: center;
            gap: clamp(.375rem, .75vw, .5rem);
            padding: clamp(.5rem, 1vw, .625rem);
            border-radius: 6px;
            cursor: pointer;
            transition: background .2s;
            user-select: none
        }

        .tree-node-header:hover {
            background: var(--accent-soft)
        }

        .tree-node-header.active {
            background: var(--accent-soft)
        }

        .tree-node-header.active .tree-node-label {
            font-weight: 600
        }

        .tree-node-toggle {
            width: clamp(1rem, 1.5vw, 1.25rem);
            height: clamp(1rem, 1.5vw, 1.25rem);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .2s;
            flex-shrink: 0;
            font-size: clamp(.7rem, 1vw, .75rem);
            color: var(--text-3)
        }

        .tree-node-toggle.expanded {
            transform: rotate(90deg)
        }

        .tree-node-toggle.leaf {
            visibility: hidden
        }

        .tree-node-dot {
            width: clamp(.5rem, .75vw, .625rem);
            height: clamp(.5rem, .75vw, .625rem);
            border-radius: 50%;
            flex-shrink: 0
        }

        .tree-node-label {
            flex: 1;
            font-size: clamp(.7rem, 1vw, .8rem);
            color: var(--text);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .tree-node-children {
            margin-left: clamp(1.25rem, 2vw, 1.5rem);
            max-height: 0;
            overflow: hidden;
            transition: max-height .3s ease-out
        }

        .tree-node-children.expanded {
            max-height: 2000px;
            transition: max-height .5s ease-in
        }

        .tree-node-dot[data-topic="basics"] {
            background: var(--color-basics)
        }

        .tree-node-dot[data-topic="datamodel"] {
            background: var(--color-datamodel)
        }

        .tree-node-dot[data-topic="soql"] {
            background: var(--color-soql)
        }

        .tree-node-dot[data-topic="apex"] {
            background: var(--color-apex)
        }

        .tree-node-dot[data-topic="lwc"] {
            background: var(--color-lwc)
        }

        .tree-node-dot[data-topic="security"] {
            background: var(--color-security)
        }

        .tree-node-dot[data-topic="flow"] {
            background: var(--color-flow)
        }

        .tree-node-dot[data-topic="integrations"] {
            background: var(--color-integrations)
        }

        .tree-node-dot[data-topic="javascript"] {
            background: var(--color-javascript)
        }

        .tree-node-dot[data-topic="git"] {
            background: var(--color-git)
        }

        .tree-node-dot[data-topic="processes"] {
            background: var(--color-processes)
        }

        .tree-node-dot[data-topic="limits"] {
            background: var(--color-limits)
        }

        .tree-node-dot[data-topic="sosl"] {
            background: var(--color-sosl)
        }

        .tree-node-dot[data-topic="setup"] {
            background: var(--color-setup)
        }

        .tree-node-dot[data-topic="aura"] {
            background: var(--color-aura)
        }

        .tree-node-dot[data-topic="visualforce"] {
            background: var(--color-visualforce)
        }

        .tree-node-dot[data-topic="ai"] {
            background: var(--color-ai)
        }

        #content-panel {
            flex: 1;
            overflow-y: auto;
            padding: clamp(1rem, 2vw, 1.5rem);
            background: var(--bg)
        }

        #content-panel::-webkit-scrollbar {
            width: 4px
        }

        #content-panel::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px
        }

        #panel-title {
            font-size: clamp(1rem, 1.5vw, 1.25rem);
            font-weight: 700;
            color: var(--text);
            margin-bottom: clamp(1rem, 2vw, 1.5rem);
            letter-spacing: -.02em
        }

        .accordion {
            margin-bottom: clamp(.75rem, 1.5vw, 1rem);
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
            background: var(--surface)
        }

        .accordion-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: clamp(.75rem, 1.5vw, 1rem) clamp(1rem, 2vw, 1.25rem);
            background: linear-gradient(135deg, var(--border-strong) 0%, var(--border) 100%);
            cursor: pointer;
            user-select: none;
            transition: all .2s
        }

        .accordion-header:hover {
            background: var(--accent-soft)
        }

        .accordion-title {
            font-weight: 600;
            font-size: clamp(.75rem, 1.2vw, .875rem);
            color: var(--text)
        }

        .accordion-toggle {
            font-size: clamp(.875rem, 1.5vw, 1rem);
            color: var(--text-3);
            transition: transform .3s
        }

        .accordion.expanded .accordion-toggle {
            transform: rotate(180deg)
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height .3s ease-out
        }

        .accordion.expanded .accordion-content {
            max-height: 5000px;
            transition: max-height .5s ease-in
        }

        .accordion-body {
            padding: clamp(.75rem, 1.5vw, 1rem)
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr));
            gap: clamp(.5rem, 1vw, .75rem);
            margin-bottom: clamp(.75rem, 1.5vw, 1rem)
        }

        .card {
            perspective: 600px;
            height: clamp(120px, 15vw, 150px);
            cursor: pointer;
            position: relative
        }

        .card.dragging {
            opacity: .5;
            transform: scale(1.02)
        }

        .card.drag-over {
            border: 2px dashed var(--border-strong);
            border-radius: 8px
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform .45s cubic-bezier(.4, 0, .2, 1);
            transform-style: preserve-3d
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg)
        }

        .front,
        .back {
            position: absolute;
            inset: 0;
            border-radius: 8px;
            border: .5px solid var(--border);
            padding: clamp(.75rem, 1.5vw, 1rem);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-family: 'IBM Plex Sans', sans-serif
        }

        .front {
            background: var(--surface)
        }

        .back {
            background: var(--code-bg);
            transform: rotateY(180deg)
        }

        .card-label {
            font-size: clamp(.7rem, 1.2vw, .8rem);
            color: var(--text);
            line-height: 1.4;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical
        }

        .flip-hint {
            font-size: clamp(.6rem, 1vw, .625rem);
            color: var(--text-3);
            position: absolute;
            bottom: clamp(.5rem, 1vw, .625rem);
            right: clamp(.5rem, 1vw, .625rem);
            opacity: .6
        }

        .back-title {
            font-size: clamp(.7rem, 1.2vw, .8rem);
            font-weight: 600;
            color: var(--text);
            margin-bottom: clamp(.5rem, 1vw, .625rem)
        }

        .back-desc {
            font-size: clamp(.65rem, 1.1vw, .75rem);
            color: var(--text-2);
            line-height: 1.5
        }

        .tip-box {
            background: rgba(251, 191, 36, .08);
            border-left: 3px solid #fbbf24;
            padding: clamp(.5rem, 1vw, .75rem);
            margin: clamp(.5rem, 1vw, .75rem) 0;
            font-size: clamp(.65rem, 1.1vw, .75rem);
            line-height: 1.6;
            color: var(--text-2);
            border-radius: 0 4px 4px 0
        }

        .info-title {
            font-weight: 600;
            color: var(--text);
            margin-bottom: clamp(.375rem, .75vw, .5rem);
            font-size: clamp(.7rem, 1.2vw, .8rem)
        }

        .info-list {
            list-style: none;
            padding: 0;
            margin: clamp(.25rem, .5vw, .375rem) 0
        }

        .info-list li {
            padding: clamp(.25rem, .5vw, .375rem) 0;
            padding-left: clamp(1rem, 1.5vw, 1.25rem);
            position: relative;
            font-size: clamp(.65rem, 1.1vw, .75rem);
            color: var(--text-2);
            line-height: 1.7
        }

        .info-list li:before {
            content: "▸";
            position: absolute;
            left: 0;
            color: var(--border-strong);
            font-weight: bold
        }

        .empty-state {
            text-align: center;
            padding: clamp(2rem, 4vw, 3rem);
            color: var(--text-3)
        }

        .empty-state-icon {
            font-size: clamp(2rem, 4vw, 3rem);
            margin-bottom: clamp(.75rem, 1.5vw, 1rem)
        }

        .empty-state-text {
            font-size: clamp(.8rem, 1.2vw, .9rem)
        }

        @media(max-width:768px) {
            #main-container {
                flex-direction: column
            }

            #tree-panel {
                width: 100%;
                max-width: 100%;
                max-height: 40vh;
                border-right: none;
                border-bottom: 1px solid var(--border)
            }

            #content-panel {
                min-height: 60vh
            }

            .card-grid {
                grid-template-columns: 1fr
            }
        }

        #content-panel {
            --topic-color: var(--border-strong)
        }

        #content-panel .accordion-header {
            border-left: 3px solid var(--topic-color)
        }

        #content-panel .card .front {
            border-top: 2px solid var(--topic-color)
        }

        #content-panel .tip-box {

                    { id: "sosl-vs-soql", label: "SOSL vs SOQL", content: { items: ["SOSL: text search, multiple objects", "SOQL: precise queries, single object", "SOSL: simpler fuzzy matching", "SOQL: relationships, aggregates"], tips: ["Choose based on use case"] } }
                ]
            },
            {
                id: "setup", label: "Setup", color: "setup", children: [
                    { id: "setup-users", label: "User Management", content: { items: ["Users: add, edit, deactivate", "Public Groups: sharing, permissions", "Queues: record ownership", "Permission Sets: grant access", "Profiles: baseline permissions"], tips: ["Use Queues for shared record ownership"] } },
                    { id: "setup-security", label: "Security Controls", content: { items: ["Session Settings: timeout, high assurance", "Password Policies: complexity, expiration", "Login Flows: custom login logic", "Login IP Ranges: restrict by IP", "Two-Factor Authentication: 2FA"], tips: ["Enable 2FA for all users"] } },
                    { id: "setup-audit", label: "Audit & Monitoring", content: { items: ["Setup Audit Trail: track changes", "Field History Tracking: data changes", "Login History: access logs", "Event Monitoring: detailed user activity"], tips: ["Regularly review audit logs"] } }
                ]
            },
            {
                id: "aura", label: "Aura Components", color: "aura", children: [
                    { id: "aura-bundle", label: "Bundle Structure", content: { items: ["Component: .cmp file", "Controller: .js (client-side)", "Helper: .js (reusable functions)", "Renderer: custom rendering logic", "CSS: styles for component"], tips: ["Use Helper for reusable code"] } },
                    { id: "aura-binding", label: "Data Binding", content: { items: ["<aura:attribute>: component state", "{!v.attribute}: value binding", "{!c.method}: controller binding", "Two-way binding with <aura:if>"], tips: ["Use expressions for dynamic values"] } },
                    { id: "aura-apex", label: "Calling Apex", content: { items: ["@AuraEnabled: expose Apex method", "<force:recordData>: LDS", "action.setCallback(): handle response", "component.get(): invoke Apex"], tips: ["Use @AuraEnabled(cacheable=true) for read-only"] } },
                    { id: "aura-events", label: "Events", content: { items: ["Component events: child → parent", "Application events: broadcast globally", "Standard events: force:showToast, etc"], tips: ["Prefer component events over application events"] } }
                ]
            },
            {
                id: "visualforce", label: "Visualforce", color: "visualforce", children: [
                    { id: "vf-pages", label: "Pages & Controllers", content: { items: ["<apex:page>: VF page markup", "Standard Controller: auto CRUD", "Custom Controller: Apex class", "Controller Extension: extend standard"], tips: ["Use standard controller when possible"] } },
                    { id: "vf-viewstate", label: "View State", content: { items: ["Holds page state between requests", "Max 135KB (65KB licensed)", "Minimize: transient keyword, re-render"], tips: ["Use transient for large, non-essential data"] } },
                    { id: "vf-js", label: "JavaScript Integration", content: { items: ["<apex:actionFunction>: call JS from Apex", "<apex:includeScript>: load JS libs", "Visualforce Remoting: async Apex calls"], tips: ["Use Remoting for async operations"] } }
                ]
            },
            {
                id: "ai", label: "AI & Agentforce", color: "ai", children: [
                    { id: "ai-concepts", label: "AI Concepts", content: { items: ["Model: algorithm trained on data", "Prompt: input to AI model", "Token: basic unit of text", "Temperature: randomness control", "Top K/P: limit output tokens", "Hallucination: false confidence"], tips: ["Lower temp = more deterministic"] } },
                    { id: "ai-einstein", label: "Einstein GPT", content: { items: ["Sales Email: generate outreach", "Service Replies: auto-response", "Work Summary: summarize records", "Einstein Copilot: AI assistant"], tips: ["Use Einstein for content generation"] } },
                    { id: "ai-prompting", label: "Prompt Engineering", content: { items: ["Be specific & provide context", "Chain of Thought: show reasoning", "Few-shot: provide examples", "Structure: clear instructions"], tips: ["Test and iterate on prompts"] } },
                    { id: "ai-agentforce", label: "Agentforce", content: { items: ["Agents: autonomous AI assistants", "Topics: agent capabilities", "Actions: what agent can do", "RAG: Retrieval-Augmented Generation"], tips: ["Start with simple agents"] } }
                ]
            }
        ];

        let selectedTopic = null;
        let draggedCard = null;
        let sourceGrid = null;

        function findTopicDeep(id, topics) {
            for (const t of topics) {
                if (t.id === id) return t;
                if (t.children) {
                    const found = findTopicDeep(id, t.children);
                    if (found) return found;
                }
            }
            return null;
        }

        function findRootParent(id) {
            for (const t of TOPICS) {
                if (t.id === id) return t;
                if (t.children) {
                    for (const c of t.children) {
                        if (c.id === id) return t;
                    }
                }
            }
            return null;
        }

        function selectTopic(id) {
            selectedTopic = id;
            const topic = findTopicDeep(id, TOPICS);
            if (!topic) return;
            document.querySelectorAll('.tree-node-header').forEach(h => h.classList.remove('active'));
            const ah = document.querySelector('[data-topic-id="' + id + '"]');
            if (ah) ah.classList.add('active');
            // Toggle tree node expansion
            const childrenEl = document.getElementById('children-' + id);
            const toggleEl = document.getElementById('toggle-' + id);
            if (childrenEl) {
                childrenEl.classList.toggle('expanded');
                if (toggleEl) toggleEl.classList.toggle('expanded');
            }
            buildContent(topic);
        }

        function buildContent(topic) {
            const cp = document.getElementById('content-panel');
            cp.innerHTML = '';
            // Apply topic color
            const root = findRootParent(topic.id);
            const colorVar = (root || topic).color || 'basics';
            cp.style.setProperty('--topic-color', 'var(--color-' + colorVar + ')');
            const t = document.createElement('h2');
            t.id = 'panel-title';
            t.textContent = topic.label;
            cp.appendChild(t);
            if (topic.children && topic.children.length > 0) {
                topic.children.forEach(c => cp.appendChild(createAccordion(c)));
            } else if (topic.content) {
                cp.appendChild(createAccordion(topic));
            }
        }

        function createAccordion(sub) {
            const acc = document.createElement('div');
            acc.className = 'accordion';
            const hd = document.createElement('div');
            hd.className = 'accordion-header';
            hd.setAttribute('role', 'button');
            hd.setAttribute('tabindex', '0');
            hd.onclick = () => toggleAcc(acc);
            hd.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleAcc(acc); } };
            const tl = document.createElement('span');
            tl.className = 'accordion-title';
            tl.textContent = sub.label;
            const tg = document.createElement('span');
            tg.className = 'accordion-toggle';
            tg.textContent = '\u25BC';
            hd.appendChild(tl);
            hd.appendChild(tg);
            const ct = document.createElement('div');
            ct.className = 'accordion-content';
            const bd = document.createElement('div');
            bd.className = 'accordion-body';
            if (sub.content) {
                const { items, tips, questions } = sub.content;
                if (items && items.length > 0) {
                    const grid = document.createElement('div');
                    grid.className = 'card-grid';
                    items.forEach((item, i) => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.setAttribute('draggable', 'true');
                        card.setAttribute('data-index', i);
                        const inner = document.createElement('div');
                        inner.className = 'card-inner';
                        const front = document.createElement('div');
                        front.className = 'front';
                        const lb = document.createElement('div');
                        lb.className = 'card-label';
                        lb.textContent = item;
                        const hint = document.createElement('span');
                        hint.className = 'flip-hint';
                        hint.textContent = 'click to flip';
                        front.appendChild(lb);
                        front.appendChild(hint);
                        const back = document.createElement('div');
                        back.className = 'back';
                        const bt = document.createElement('div');
                        bt.className = 'back-title';
                        bt.textContent = sub.label;
                        const bd2 = document.createElement('div');
                        bd2.className = 'back-desc';
                        bd2.textContent = item;
                        back.appendChild(bt);
                        back.appendChild(bd2);
                        inner.appendChild(front);
                        inner.appendChild(back);
                        card.appendChild(inner);
                        card.onclick = function () { this.classList.toggle('flipped'); };
                        card.addEventListener('dragstart', handleDragStart);
                        card.addEventListener('dragend', handleDragEnd);
                        grid.appendChild(card);
                    });
                    bd.appendChild(grid);
                }
                if (tips && tips.length > 0) {
                    tips.forEach(tip => {
                        const tb = document.createElement('div');
                        tb.className = 'tip-box';
                        tb.textContent = tip;
                        bd.appendChild(tb);
                    });
                }
                if (questions && questions.length > 0) {
                    const it = document.createElement('div');
                    it.className = 'info-title';
                    it.textContent = 'Interview Questions';
                    bd.appendChild(it);
                    const ul = document.createElement('ul');
                    ul.className = 'info-list';
                    questions.forEach(q => {
                        const li = document.createElement('li');
                        li.textContent = q;
                        ul.appendChild(li);
                    });
                    bd.appendChild(ul);
                }
            }
            ct.appendChild(bd);
            acc.appendChild(hd);
            acc.appendChild(ct);
            return acc;
        }

        function toggleAcc(acc) {
            const ct = acc.querySelector('.accordion-content');
            const expanded = acc.classList.contains('expanded');
            if (expanded) { acc.classList.remove('expanded'); ct.style.maxHeight = '0'; }
            else { acc.classList.add('expanded'); ct.style.maxHeight = '5000px'; }
        }

        function handleDragStart(e) {
            const card = e.target.closest('.card');
            if (!card) return;
            draggedCard = card;
            sourceGrid = card.closest('.card-grid');
            card.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', '');
        }

        function handleDragEnd(e) {
            if (draggedCard) { draggedCard.classList.remove('dragging'); }
            document.querySelectorAll('.card').forEach(c => c.classList.remove('drag-over'));
            draggedCard = null;
            sourceGrid = null;
        }

        document.addEventListener('dragover', e => {
            e.preventDefault();
            document.querySelectorAll('.card.drag-over').forEach(c => c.classList.remove('drag-over'));
            const card = e.target.closest('.card');
            if (card && sourceGrid) { card.classList.add('drag-over'); }
        });

        document.addEventListener('drop', e => {
            e.preventDefault();
            const target = e.target.closest('.card');
            if (!target || !draggedCard || !sourceGrid) return;
            const targetGrid = target.closest('.card-grid');
            if (sourceGrid !== targetGrid) return;
            const cards = Array.from(sourceGrid.querySelectorAll('.card'));
            const fromIdx = cards.indexOf(draggedCard);
            const toIdx = cards.indexOf(target);
            if (fromIdx === toIdx) return;
            cards.splice(fromIdx, 1);
            cards.splice(toIdx, 0, draggedCard);
            sourceGrid.innerHTML = '';
            cards.forEach((c, i) => { c.setAttribute('data-index', i); sourceGrid.appendChild(c); });
        });

        function buildTree() {
            const tc = document.getElementById('tree');
            tc.innerHTML = '';
            TOPICS.forEach(topic => tc.appendChild(createTreeNode(topic)));
        }

        function createTreeNode(topic) {
            const c = document.createElement('div');
            c.className = 'tree-node';
            const hd = document.createElement('div');
            hd.className = 'tree-node-header';
            hd.setAttribute('role', 'treeitem');
            hd.setAttribute('tabindex', '0');
            hd.setAttribute('data-topic-id', topic.id);
            hd.onclick = () => selectTopic(topic.id);
            hd.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectTopic(topic.id); } };
            const tg = document.createElement('span');
            tg.className = 'tree-node-toggle';
            tg.textContent = '\u25B6';
            if (topic.children && topic.children.length > 0) { tg.id = 'toggle-' + topic.id; }
            else { tg.classList.add('leaf'); }
            const dot = document.createElement('span');
            dot.className = 'tree-node-dot';
            dot.setAttribute('data-topic', topic.color);
            const lb = document.createElement('span');
            lb.className = 'tree-node-label';
            lb.textContent = topic.label;
            hd.appendChild(tg); hd.appendChild(dot); hd.appendChild(lb);
            c.appendChild(hd);
            if (topic.children && topic.children.length > 0) {
                const ch = document.createElement('div');
                ch.className = 'tree-node-children';
                ch.id = 'children-' + topic.id;
                topic.children.forEach(child => ch.appendChild(createTreeNode(child)));
                c.appendChild(ch);
            }
            return c;
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                document.getElementById('content-panel').innerHTML = '<div class="empty-state"><div class="empty-state-icon">\uD83C\uDF33</div><div class="empty-state-text">Select a topic from tree to explore</div></div>';
                document.querySelectorAll('.tree-node-header').forEach(h => h.classList.remove('active'));
            }
        });

        function setupSearch() {
            const si = document.getElementById('search-input');
            let dt;
            si.addEventListener('input', e => {
                clearTimeout(dt);
                dt = setTimeout(() => {
                    const q = e.target.value.toLowerCase().trim();
                    if (q === '') {
                        document.querySelectorAll('.tree-node').forEach(n => { n.style.display = ''; });
                        return;
                    }
                    document.querySelectorAll('.tree-node').forEach(n => {
                        const labels = n.querySelectorAll('.tree-node-label');
                        let anyMatch = false;
                        labels.forEach(lbl => { if (lbl.textContent.toLowerCase().includes(q)) anyMatch = true; });
                        n.style.display = anyMatch ? '' : 'none';
                        if (anyMatch) {
                            const ch = n.querySelector(':scope > .tree-node-children');
                            const tg = n.querySelector(':scope > .tree-node-header .tree-node-toggle');
                            if (ch) ch.classList.add('expanded');
                            if (tg) tg.classList.add('expanded');
                        }
                    });
                }, 300);
            });
        }

        document.addEventListener('DOMContentLoaded', () => { buildTree(); setupSearch(); });
    </script>
</body>
